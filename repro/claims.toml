# What repro_claims.py can reproduce. An artifact is a pinned download; a
# claim names the artifacts it needs, how the recognizer is loaded, and the
# decoder configurations ("arms") to compare on one test set. In arguments,
# {name} is the directory artifact "name" was unpacked into.

[artifacts.zipformer-ctc-en]
url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-ctc-en-2023-10-02.tar.bz2"
sha256 = "8e695f9e6609f82d826742f71bbb6c4693950abdb5f06f6938a1dbaa0dcdb60e"

[artifacts.librispeech-test-other]
url = "https://www.openslr.org/resources/12/test-other.tar.gz"
sha256 = "d09c181bba5cf717b3dee7d4d592af11a3ee3a09e08ae025c5506f6ebe961c29"

# A tiny English character LSTM (one layer of 256, 1.6 MB) trained for 15
# minutes so that check_parallel.py has a recurrent scorer to run. It is a
# test fixture: no claim may rest on its quality.
[artifacts.test-char-lstm]
url = "https://huggingface.co/graehl/sherpa-onnx-fusion-test-lm/resolve/1fb385230c7e25058fd6b406e5a88d2de81cc350/en-char-lstm-256x1.onnx"
sha256 = "dda776a29cfbb1378d3749be0a918250f5bd5e19d6afcf958ed0b6b9fed5d548"

[artifacts.test-char-lstm-units]
url = "https://huggingface.co/graehl/sherpa-onnx-fusion-test-lm/resolve/1fb385230c7e25058fd6b406e5a88d2de81cc350/en-char-lstm-256x1.units.hex"
sha256 = "3dac32f9a969fa0bb6af2965323b8a6d77912b1e36cd639ac5a2b1f9b7180d2c"

[claims.ctc-shipped-graph]
summary = "English zipformer CTC: greedy, upstream's shipped word 3-gram graph, and the prefix search without a language model"
artifacts = ["zipformer-ctc-en", "librispeech-test-other"]
test_set = "librispeech-test-other"
recognizer = [
  "--zipformer-ctc-model={zipformer-ctc-en}/sherpa-onnx-zipformer-ctc-en-2023-10-02/model.onnx",
  "--tokens={zipformer-ctc-en}/sherpa-onnx-zipformer-ctc-en-2023-10-02/tokens.txt",
  "--num-threads=2",
]

[[claims.ctc-shipped-graph.arms]]
name = "greedy"
args = ["--decoding-method=greedy_search"]

[[claims.ctc-shipped-graph.arms]]
name = "shipped word 3-gram graph"
args = ["--ctc.graph={zipformer-ctc-en}/sherpa-onnx-zipformer-ctc-en-2023-10-02/HLG.fst"]

[[claims.ctc-shipped-graph.arms]]
name = "prefix search, best alignment, no LM"
args = ["--decoding-method=prefix_beam_search", "--ctc-alignment=max", "--max-active-paths=8"]
